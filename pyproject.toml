[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus-harness"
version = "0.1.0"
description = "Odysseus -- the smallest agent harness. Twelve files, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# No runtime dependencies: standard library only.
dependencies = []

[project.scripts]
odysseus = "odysseus.cli:main"

[tool.setuptools]
packages = ["odysseus"]
